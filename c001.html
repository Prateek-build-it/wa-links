*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#0b141a;
  display:flex;justify-content:center;align-items:center;
  height:100vh;overflow:hidden;

/* Subtle green glow behind the card */
body::before{
  content:'';position:fixed;top:40%;left:50%;
  width:300px;height:300px;
  background:radial-gradient(circle,rgba(37,211,102,0.08) 0%,transparent 70%);
  transform:translate(-50%,-50%);pointer-events:none;
}

/* Card container */
.card{
  text-align:center;max-width:320px;width:88%;
  animation:fadeIn .3s ease;
}
@keyframes fadeIn{
  from{opacity:0;transform:scale(0.96)}
  to{opacity:1;transform:scale(1)}
}

/* WhatsApp icon wrapper */
.icon-wrap{
  width:64px;height:64px;margin:0 auto 20px;position:relative;
}

/* Expanding ring behind icon */
.icon-ring{
  position:absolute;inset:0;border-radius:50%;
  background:rgba(37,211,102,0.15);
  animation:ring 1.5s ease infinite;
}
@keyframes ring{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.35);opacity:0}
}

/* Green circle with WhatsApp SVG */
.icon-circle{
  position:relative;width:64px;height:64px;
  background:#25D366;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.icon-circle svg{width:32px;height:32px;fill:#fff}

/* Client name */
.name{
  font-size:18px;font-weight:600;color:#e9edef;margin-bottom:6px;
}

/* Step text with fade-in animation on each change */
.step{
  font-size:13px;color:rgba(233,237,239,0.5);
  margin-bottom:24px;height:18px;
}
.step span{
  display:inline-block;
  animation:stepFade .3s ease;
}
@keyframes stepFade{
  from{opacity:0;transform:translateY(4px)}
  to{opacity:1;transform:translateY(0)}
}

/* Progress bar track */
.bar-wrap{
  height:3px;background:rgba(255,255,255,0.06);
  border-radius:2px;overflow:hidden;margin:0 20px;
}

/* Progress bar fill — 1.1 second eased animation */
.bar-fill{
  height:100%;width:0;
  background:linear-gradient(90deg,#128C7E,#25D366);
  border-radius:2px;
  animation:progress 1.1s cubic-bezier(0.4,0,0.2,1) forwards;
}
@keyframes progress{
  0%{width:0}
  30%{width:30%}
  60%{width:60%}
  80%{width:82%}
  100%{width:100%}
}

/* WhatsApp-style typing dots */
.dots{
  display:flex;justify-content:center;gap:4px;
  margin-top:20px;
  opacity:0;animation:dotsIn .2s ease .15s forwards;
}
@keyframes dotsIn{to{opacity:1}}
.dots span{
  width:6px;height:6px;
  background:rgba(37,211,102,0.5);
  border-radius:50%;
  animation:bounce .6s ease infinite;
}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{
  0%,100%{transform:translateY(0);opacity:0.5}
  50%{transform:translateY(-6px);opacity:1}
}

/* Fallback tap link — appears after 1.5s */
.tap{
  display:inline-block;margin-top:28px;padding:8px 20px;
  background:rgba(37,211,102,0.1);
  border:1px solid rgba(37,211,102,0.2);
  border-radius:8px;color:#25D366;text-decoration:none;font-size:12px;
  opacity:0;animation:tapIn .2s ease 1.5s forwards;
}
@keyframes tapIn{to{opacity:1}}

/* "end-to-end encrypted" badge at bottom */
.badge{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:4px;
  font-size:10px;color:rgba(233,237,239,0.25);
}
.badge svg{width:10px;height:10px;fill:rgba(233,237,239,0.25)}
</style>
